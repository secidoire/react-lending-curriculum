<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>備品の貸出一覧</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>備品の貸出一覧</h1>

    <form id="add-form">
      <label>備品名 <input name="itemName" required /></label>
      <label>借りる人 <input name="userName" required /></label>
      <label for="status">状態</label>
      <select id="status" name="status">
        <option value="reserved">予約中</option>
        <option value="lent">貸出中</option>
      </select>
      <button type="submit">追加</button>
    </form>

    <label><input type="checkbox" id="lent-only" /> 貸出中のみ表示</label>

    <table>
      <thead>
        <tr>
          <th>備品</th>
          <th>借りている人</th>
          <th>状態</th>
          <th>メモ</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="loan-rows"></tbody>
    </table>

    <script type="module" src="./main.js"></script>
  </body>
</html>
